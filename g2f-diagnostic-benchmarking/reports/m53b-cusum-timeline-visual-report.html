<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G2F M5.3b CUSUM Timeline</title>
<style>
:root {
  color-scheme: light dark;
  --bg: Canvas;
  --fg: CanvasText;
  --muted: color-mix(in srgb, CanvasText 68%, Canvas);
  --line: color-mix(in srgb, CanvasText 20%, Canvas);
  --soft: color-mix(in srgb, CanvasText 7%, Canvas);
  --series1: #2563eb;
  --series2: #059669;
  --series3: #d97706;
  --bad: #dc2626;
}
body {
  margin: 0;
  padding: 28px;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
main { max-width: 1160px; margin: 0 auto; }
h1 { margin: 0 0 6px; font-size: 26px; font-weight: 500; }
h2 { margin: 24px 0 10px; font-size: 18px; font-weight: 500; }
p { color: var(--muted); margin: 0 0 14px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin: 18px 0; }
label { display: grid; gap: 4px; color: var(--muted); }
select { color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; min-width: 180px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr)); gap: 10px; margin: 10px 0 16px; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: var(--soft); }
.k { color: var(--muted); font-size: 12px; }
.v { font-size: 22px; font-weight: 500; margin-top: 3px; }
svg { width: 100%; height: auto; display: block; }
.axis text, .label, .tick-label { fill: var(--muted); font-size: 12px; }
.gridline { stroke: var(--line); stroke-width: 1; }
.stress-line { fill: none; stroke: var(--series1); stroke-width: 2; }
.cusum-line { fill: none; stroke: var(--series2); stroke-width: 2.2; }
.threshold-line { stroke: var(--series3); stroke-width: 1.5; stroke-dasharray: 5 5; }
.alarm-band { fill: color-mix(in srgb, var(--series3) 22%, transparent); }
.onset { stroke: var(--bad); stroke-width: 2; }
.dot { fill: var(--series1); stroke: var(--bg); stroke-width: 1; }
.cusum-dot { fill: var(--series2); stroke: var(--bg); stroke-width: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; color: var(--muted); margin-top: 6px; }
.swatch { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 5px; }
.s1 { background: var(--series1); }
.s2 { background: var(--series2); }
.s3 { background: var(--series3); }
.s4 { background: var(--bad); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; margin-top: 12px; }
table { width: 100%; border-collapse: collapse; min-width: 840px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { background: var(--soft); font-weight: 500; }
</style>
</head>

<main>

const envSel = document.getElementById("env");
const famSel = document.getElementById("family");
const svg = document.getElementById("chart");
const summary = document.getElementById("summary");
const topTable = document.getElementById("top-table");
const envOrder = Array.from(new Set(rows.map(d => d.Env))).sort((a,b) => {
  const ma = Math.max(...rows.filter(d => d.Env === a).map(d => d.maxCusum));
  const mb = Math.max(...rows.filter(d => d.Env === b).map(d => d.maxCusum));
  return mb - ma || a.localeCompare(b);
});
for (const env of envOrder) {
  const option = document.createElement("option");
  option.value = env;
  option.textContent = env;
  envSel.appendChild(option);
}
const families = Array.from(new Set(rows.map(d => d.family))).sort();
for (const family of families) {
  const option = document.createElement("option");
  option.value = family;
  option.textContent = family.replaceAll("_", " ");
  famSel.appendChild(option);
}
function setDefaultFamily() {
  const envRows = rows.filter(d => d.Env === envSel.value);
  const best = envRows.reduce((a,b) => a.maxCusum >= b.maxCusum ? a : b);
  famSel.value = best.family;
}
function scale(v, lo, hi, outLo, outHi) {
  if (hi === lo) return (outLo + outHi) / 2;
  return outLo + (v - lo) * (outHi - outLo) / (hi - lo);
}
function linePath(points, xKey, yKey, yScale) {
  return points.map((d,i) => `${i ? "L" : "M"} ${scale(d[xKey], 0, 12, 70, 1010).toFixed(2)} ${yScale(d[yKey]).toFixed(2)}`).join(" ");
}
function render() {
  const env = envSel.value;
  const family = famSel.value;
  const data = rows.filter(d => d.Env === env && d.family === family).sort((a,b) => a.w - b.w);
  if (!data.length) return;
  const first = data[0];
  const maxY = Math.max(first.h, first.zThreshold, ...data.map(d => d.cusum), ...data.map(d => Math.abs(d.stress)), 1);
  const yStress = v => scale(v, -maxY, maxY, 360, 40);
  const yCusum = v => scale(v, 0, maxY, 360, 40);
  const onset = first.onset;
  summary.innerHTML = [
    ["Round", first.round],
    ["M5 shift", first.shift || "not scored"],
    ["M5 abs delta", first.delta.toFixed(3)],
    ["max CUSUM", first.maxCusum.toFixed(3)],
    ["onset day", onset === "" ? "none" : String(onset * 30)],
    ["duration windows", String(first.duration)]
  ].map(([k,v]) => `<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
  let parts = [];
  for (let i=0; i<=6; i++) {
    const yv = -maxY + 2 * maxY * i / 6;
    const y = yStress(yv);
    parts.push(`<line x1="70" x2="1010" y1="${y}" y2="${y}" class="gridline"></line>`);
    parts.push(`<text x="58" y="${y+4}" text-anchor="end" class="tick-label">${yv.toFixed(1)}</text>`);
  }
  for (let w=0; w<=12; w+=2) {
    const x = scale(w, 0, 12, 70, 1010);
    parts.push(`<line x1="${x}" x2="${x}" y1="40" y2="360" class="gridline"></line>`);
    parts.push(`<text x="${x}" y="390" text-anchor="middle" class="tick-label">w${String(w).padStart(2,"0")}</text>`);
  }
  for (const d of data.filter(d => d.alarmFlag)) {
    const x = scale(d.w, 0, 12, 70, 1010) - 28;
    parts.push(`<rect x="${x}" y="40" width="56" height="320" class="alarm-band"></rect>`);
  }
  parts.push(`<line x1="70" x2="1010" y1="${yStress(first.zThreshold)}" y2="${yStress(first.zThreshold)}" class="threshold-line"></line>`);
  parts.push(`<line x1="70" x2="1010" y1="${yCusum(first.h)}" y2="${yCusum(first.h)}" class="threshold-line"></line>`);
  if (onset !== "") {
    const x = scale(onset, 0, 12, 70, 1010);
    parts.push(`<line x1="${x}" x2="${x}" y1="34" y2="368" class="onset"></line>`);
    parts.push(`<text x="${x+6}" y="54" class="label">onset</text>`);
  }
  parts.push(`<path d="${linePath(data, "w", "stress", yStress)}" class="stress-line"></path>`);
  parts.push(`<path d="${linePath(data, "w", "cusum", yCusum)}" class="cusum-line"></path>`);
  for (const d of data) {
    const x = scale(d.w, 0, 12, 70, 1010);
    parts.push(`<circle cx="${x}" cy="${yStress(d.stress)}" r="4" class="dot"><title>w${d.w} stress z=${d.stress.toFixed(2)} driver=${d.driver}</title></circle>`);
    parts.push(`<circle cx="${x}" cy="${yCusum(d.cusum)}" r="4" class="cusum-dot"><title>w${d.w} CUSUM=${d.cusum.toFixed(2)}</title></circle>`);
  }
  parts.push(`<text x="540" y="426" text-anchor="middle" class="label">30-day window index</text>`);
  parts.push(`<text x="18" y="210" transform="rotate(-90 18 210)" text-anchor="middle" class="label">stress z / CUSUM scale</text>`);
  parts.push(`<text x="70" y="22" class="label">${env} · ${family.replaceAll("_"," ")} · k=${first.k} · z=${first.zThreshold} · h=${first.h}</text>`);
  svg.innerHTML = parts.join("");
}
function renderTopTable() {
  const grouped = new Map();
  for (const d of rows) {
    const key = d.Env + "|" + d.family;
    if (!grouped.has(key) || d.maxCusum > grouped.get(key).maxCusum) grouped.set(key, d);
  }
  const top = Array.from(grouped.values()).sort((a,b) => b.maxCusum - a.maxCusum).slice(0, 12);
  topTable.innerHTML = `<table><thead><tr><th>Env</th><th>Round</th><th>Family</th><th>Max CUSUM</th><th>Onset</th><th>Duration</th><th>Driver</th><th>M5 shift</th></tr></thead><tbody>${top.map(d => `<tr><td>${d.Env}</td><td>${d.round}</td><td>${d.family.replaceAll("_"," ")}</td><td>${d.maxCusum.toFixed(3)}</td><td>${d.onset === "" ? "" : "w"+d.onset}</td><td>${d.duration}</td><td>${d.driver}</td><td>${d.shift || ""}</td></tr>`).join("")}</tbody></table>`;
}
envSel.addEventListener("change", () => { setDefaultFamily(); render(); });
famSel.addEventListener("change", render);
envSel.value = envOrder[0];
setDefaultFamily();
render();
renderTopTable();
</script>
