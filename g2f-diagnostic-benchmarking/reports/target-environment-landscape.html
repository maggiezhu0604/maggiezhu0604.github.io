  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;div id=&quot;g2f-target-env-landscape&quot; class=&quot;g2f-env-vis&quot;&gt;
  &lt;style&gt;
    #g2f-target-env-landscape { color: var(--foreground); font-size: var(--font-size-base); }
    #g2f-target-env-landscape .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
    #g2f-target-env-landscape .toolbar span { color: var(--muted-foreground); }
    #g2f-target-env-landscape .btn { border:1px solid var(--border); background:var(--secondary); color:var(--secondary-foreground); padding:6px 10px; border-radius:6px; cursor:pointer; }
    #g2f-target-env-landscape .btn[aria-pressed=&quot;true&quot;] { background:var(--primary); color:var(--primary-foreground); border-color:var(--primary); }
    #g2f-target-env-landscape .wrap { display:grid; grid-template-columns:minmax(0,1.45fr) minmax(260px,.8fr); gap:14px; align-items:start; }
    #g2f-target-env-landscape .panel { border:1px solid var(--border); border-radius:8px; background:color-mix(in srgb, var(--card) 88%, transparent); padding:12px; }
    #g2f-target-env-landscape svg { width:100%; height:auto; display:block; overflow:visible; }
    #g2f-target-env-landscape .axis text, #g2f-target-env-landscape .note { fill:var(--muted-foreground); color:var(--muted-foreground); }
    #g2f-target-env-landscape .axis line, #g2f-target-env-landscape .axis path, #g2f-target-env-landscape .grid { stroke:var(--border); }
    #g2f-target-env-landscape .diag { stroke:var(--muted-foreground); stroke-width:1.2; stroke-dasharray:4 4; opacity:.75; }
    #g2f-target-env-landscape .pt { stroke:var(--background); stroke-width:1.2; cursor:pointer; }
    #g2f-target-env-landscape .pt.y2022 { fill:var(--viz-series-1); }
    #g2f-target-env-landscape .pt.y2024 { fill:var(--viz-series-2); }
    #g2f-target-env-landscape .pt.selected { stroke:var(--foreground); stroke-width:2.5; }
    #g2f-target-env-landscape .label { fill:var(--foreground); font-weight:500; }
    #g2f-target-env-landscape .muted { color:var(--muted-foreground); }
    #g2f-target-env-landscape .detail-title { display:flex; justify-content:space-between; gap:10px; align-items:baseline; margin-bottom:8px; }
    #g2f-target-env-landscape .env-name { font-weight:500; }
    #g2f-target-env-landscape .metrics { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin:10px 0; }
    #g2f-target-env-landscape .metric { border:1px solid var(--border); border-radius:6px; padding:8px; }
    #g2f-target-env-landscape .metric b { display:block; font-weight:500; }
    #g2f-target-env-landscape .barrow { display:grid; grid-template-columns:84px minmax(0,1fr) 58px; gap:8px; align-items:center; margin:8px 0; }
    #g2f-target-env-landscape .track { height:9px; border-radius:99px; background:var(--muted); overflow:hidden; }
    #g2f-target-env-landscape .fill { height:100%; background:var(--viz-series-3); }
    #g2f-target-env-landscape .surprises { margin-top:10px; display:grid; gap:5px; }
    #g2f-target-env-landscape .surprise { display:grid; grid-template-columns:80px minmax(0,1fr) 62px; gap:8px; border:1px solid var(--border); border-radius:6px; padding:6px 8px; background:color-mix(in srgb, var(--card) 72%, transparent); cursor:pointer; text-align:left; color:var(--foreground); }
    #g2f-target-env-landscape .surprise[aria-pressed=&quot;true&quot;] { outline:2px solid var(--ring); }
    #g2f-target-env-landscape .legend { display:flex; gap:12px; flex-wrap:wrap; margin-top:8px; color:var(--muted-foreground); }
    #g2f-target-env-landscape .sw { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:-1px; }
    #g2f-target-env-landscape .sw.a { background:var(--viz-series-1); }
    #g2f-target-env-landscape .sw.b { background:var(--viz-series-2); }
    @media (max-width: 760px) { #g2f-target-env-landscape .wrap { grid-template-columns:1fr; } }

    });
    plot.insertAdjacentHTML(&#x27;beforeend&#x27;, `&lt;line class=&quot;diag&quot; x1=&quot;${sx(lo,lo,hi)}&quot; y1=&quot;${sy(lo,lo,hi)}&quot; x2=&quot;${sx(hi,lo,hi)}&quot; y2=&quot;${sy(hi,lo,hi)}&quot; /&gt;`);

  }
  function bar(label, val, max, suffix=&#x27;&#x27;) {

      &lt;/div&gt;
      &lt;div class=&quot;muted&quot;&gt;Largest history surprises&lt;/div&gt;&lt;div class=&quot;surprises&quot;&gt;${surprises}&lt;/div&gt;`;
    detail.querySelectorAll(&#x27;.surprise&#x27;).forEach(btn=&gt;btn.addEventListener(&#x27;click&#x27;,()=&gt;{
      const found=data.find(x=&gt;x.env===btn.dataset.env &amp;&amp; (round===&#x27;all&#x27;||x.round===round));
      if(found){ selected=found; renderPlot(); renderDetail(); }
    }));
  }
  root.querySelectorAll(&#x27;[data-round]&#x27;).forEach(btn=&gt;btn.addEventListener(&#x27;click&#x27;,()=&gt;{
    round=btn.dataset.round;
    root.querySelectorAll(&#x27;[data-round]&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-pressed&#x27;, String(b===btn)));
    renderPlot(); renderDetail();
  }));
  renderPlot(); renderDetail();
})();
